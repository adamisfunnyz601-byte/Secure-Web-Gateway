name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install all dependencies including desktop build tools
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify Electron build tools are installed
        run: |
          npm ls electron electron-builder
          node ./node_modules/electron-builder/cli.js --version

      - name: Build Windows installer
        run: node ./node_modules/electron-builder/cli.js --win nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Web-Gateway-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14
