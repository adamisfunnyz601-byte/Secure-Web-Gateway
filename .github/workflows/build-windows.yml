name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # The existing lockfile contains Replit-internal package URLs and is
      # out of sync with package.json. Resolve cleanly from the public registry.
      - name: Install dependencies from public npm registry
        run: npm install --package-lock=false --include=dev --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Verify required packages and dependency tree
        shell: pwsh
        run: |
          npm ls electron electron-builder debug --depth=0
          node -e "require.resolve('electron'); require.resolve('electron-builder'); require.resolve('debug'); console.log('Electron build dependencies are resolvable.')"

      - name: Build Windows installer
        run: npm run desktop:dist -- --publish=never

      - name: Verify installer was created
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist-electron -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $installer) { throw "No Windows installer was produced in dist-electron." }
          $installer | ForEach-Object { Write-Host $_.FullName }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Web-Gateway-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 14
